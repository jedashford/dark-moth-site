<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><title>All electronics on one carrier · 18 × 24 holes — top worksheet</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192b33}.mono{font-family:Courier New,monospace}</style><rect width="1680" height="1188" fill="white"/><text x="60.00" y="53.00" font-size="31" font-weight="bold">DARK MOTH / ONE CARRIER / MODULES &amp; CABLES</text><text x="60.00" y="85.00" font-size="19" >Exact carrier hole → electrical role on the purchased module. Match printed labels; module pad coordinates are not measured.</text><text x="60.00" y="115.00" font-size="19" font-weight="bold">Use ONE ESP variant column. Battery, LED strip and remote button remain off-board on cables.</text><text x="60.00" y="162.00" font-size="22" font-weight="bold">14 ON-CARRIER MODULE PIGTAILS</text><text x="60.00" y="193.00" font-size="17" font-weight="bold">Hole / net</text><text x="260.00" y="193.00" font-size="17" font-weight="bold">ESP32-C3 endpoint</text><text x="570.00" y="193.00" font-size="17" font-weight="bold">ESP32-S3 endpoint</text><g data-module-link="carrier-harness-ESP_POWER" data-carrier-hole="O5"><text x="60.00" y="225.00" font-size="17" font-weight="bold">O5  VSW</text><text x="260.00" y="225.00" font-size="17" >ESP.5V / VIN</text><text x="570.00" y="225.00" font-size="17" >ESP.5V / VIN</text></g><path d="M60.00,240.00 L880.00,240.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-ESP_GND" data-carrier-hole="T11"><text x="60.00" y="269.00" font-size="17" font-weight="bold">T11  GND</text><text x="260.00" y="269.00" font-size="17" >ESP.GND</text><text x="570.00" y="269.00" font-size="17" >ESP.GND</text></g><path d="M60.00,284.00 L880.00,284.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-LATCH_GPIO" data-carrier-hole="P8">
<text x="60.00" y="313.00" font-size="17" font-weight="bold">P8  GATE</text><text x="260.00" y="313.00" font-size="17" >ESP GPIO3</text><text x="570.00" y="313.00" font-size="17" >ESP GPIO9</text></g><path d="M60.00,328.00 L880.00,328.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-SENSE_GPIO" data-carrier-hole="X7"><text x="60.00" y="357.00" font-size="17" font-weight="bold">X7  SENSE</text><text x="260.00" y="357.00" font-size="17" >ESP GPIO4</text><text x="570.00" y="357.00" font-size="17" >ESP GPIO8</text></g><path d="M60.00,372.00 L880.00,372.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_G" data-carrier-hole="A12"><text x="60.00" y="401.00" font-size="17" font-weight="bold">A12  PWM_G</text><text x="260.00" y="401.00" font-size="17" >ESP GPIO5</text><text x="570.00" y="401.00" font-size="17" >ESP GPIO5</text></g><path d="M60.00,416.00 L880.00,416.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_R" data-carrier-hole="A16"><text x="60.00" y="445.00" font-size="17" font-weight="bold">A16  PWM_R</text><text x="260.00" y="445.00" font-size="17" >ESP GPIO6</text><text x="570.00" y="445.00" font-size="17" >ESP GPIO4</text></g><path d="M60.00,460.00 L880.00,460.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_B" data-carrier-hole="C15">
<text x="60.00" y="489.00" font-size="17" font-weight="bold">C15  PWM_B</text><text x="260.00" y="489.00" font-size="17" >ESP GPIO7</text><text x="570.00" y="489.00" font-size="17" >ESP GPIO6</text></g><path d="M60.00,504.00 L880.00,504.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_WW" data-carrier-hole="G15"><text x="60.00" y="533.00" font-size="17" font-weight="bold">G15  PWM_WW</text><text x="260.00" y="533.00" font-size="17" >ESP GPIO10</text><text x="570.00" y="533.00" font-size="17" >ESP GPIO10</text></g><path d="M60.00,548.00 L880.00,548.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_CW" data-carrier-hole="I15"><text x="60.00" y="577.00" font-size="17" font-weight="bold">I15  PWM_CW</text><text x="260.00" y="577.00" font-size="17" >ESP GPIO20</text><text x="570.00" y="577.00" font-size="17" >ESP GPIO11</text></g><path d="M60.00,592.00 L880.00,592.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-CHARGER_POS" data-carrier-hole="O1"><text x="60.00" y="621.00" font-size="17" font-weight="bold">O1  OUT+</text><text x="260.00" y="621.00" font-size="17" >CHG.OUT+</text><text x="570.00" y="621.00" font-size="17" >CHG.OUT+</text></g><path d="M60.00,636.00 L880.00,636.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-CHARGER_GND" data-carrier-hole="S11">
<text x="60.00" y="665.00" font-size="17" font-weight="bold">S11  GND</text><text x="260.00" y="665.00" font-size="17" >CHG.OUT- (not BAT-)</text><text x="570.00" y="665.00" font-size="17" >CHG.OUT- (not BAT-)</text></g><path d="M60.00,680.00 L880.00,680.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-BOOST_POS" data-carrier-hole="O4"><text x="60.00" y="709.00" font-size="17" font-weight="bold">O4  VSW</text><text x="260.00" y="709.00" font-size="17" >BOOST.VIN+</text><text x="570.00" y="709.00" font-size="17" >BOOST.VIN+</text></g><path d="M60.00,724.00 L880.00,724.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-BOOST_GND" data-carrier-hole="U11"><text x="60.00" y="753.00" font-size="17" font-weight="bold">U11  GND</text><text x="260.00" y="753.00" font-size="17" >BOOST.VIN-</text><text x="570.00" y="753.00" font-size="17" >BOOST.VIN-</text></g><path d="M60.00,768.00 L880.00,768.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-BOOST_OUT_GND" data-carrier-hole="V11"><text x="60.00" y="797.00" font-size="17" font-weight="bold">V11  GND</text><text x="260.00" y="797.00" font-size="17" >BOOST.VOUT-</text><text x="570.00" y="797.00" font-size="17" >BOOST.VOUT-</text></g><path d="M60.00,812.00 L880.00,812.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60.00" y="885.00" font-size="17" >Lap-solder each insulated pigtail to the named pad/leg joint underneath. Do not insert a</text>
<text x="60.00" y="908.00" font-size="17" >second wire through an occupied hole. Strain-relieve the cable separately; a solder</text><text x="60.00" y="931.00" font-size="17" >joint is not a mechanical anchor.</text><text x="60.00" y="980.00" font-size="17" >Module endpoints above are logical roles, not header order. No module mounting holes or</text><text x="60.00" y="1003.00" font-size="17" >header positions are assigned. Measure the actual boards and insulate exposed underside</text><text x="60.00" y="1026.00" font-size="17" >pads before securing them.</text><text x="950.00" y="162.00" font-size="22" font-weight="bold">OFF-BOARD BUTTON &amp; LED WIRES</text><g data-external-terminal="BUTTON_PLUS"><text x="950.00" y="199.00" font-size="18" font-weight="bold">O2  OUT+</text><text x="950.00" y="222.00" font-size="16" >BUTTON_PLUG.OUT+ → SW_REMOTE.contact_A</text></g><g data-external-terminal="BUTTON_RETURN"><text x="950.00" y="258.00" font-size="18" font-weight="bold">V1  BTN_N</text><text x="950.00" y="281.00" font-size="16" >BUTTON_PLUG.BTN_N → SW_REMOTE.contact_B</text></g><g data-external-terminal="LED_G"><text x="950.00" y="317.00" font-size="18" font-weight="bold">C12  LED_G</text><text x="950.00" y="340.00" font-size="16" >LED.G</text></g><g data-external-terminal="LED_R"><text x="950.00" y="376.00" font-size="18" font-weight="bold">C16  LED_R</text><text x="950.00" y="399.00" font-size="16" >LED.R</text></g><g data-external-terminal="LED_B"><text x="950.00" y="435.00" font-size="18" font-weight="bold">E12  LED_B</text>
<text x="950.00" y="458.00" font-size="16" >LED.B</text></g><g data-external-terminal="LED_WW"><text x="950.00" y="494.00" font-size="18" font-weight="bold">E16  LED_WW</text><text x="950.00" y="517.00" font-size="16" >LED.WW</text></g><g data-external-terminal="LED_CW"><text x="950.00" y="553.00" font-size="18" font-weight="bold">G12  LED_CW</text><text x="950.00" y="576.00" font-size="16" >LED.CW</text></g><text x="950.00" y="632.00" font-size="20" font-weight="bold">DIRECT MODULE CABLES · no carrier hole</text><text x="950.00" y="667.00" font-size="18" font-weight="bold" data-direct-wire="module-CELL+">BATT.+ → CHG.BAT+</text><text x="950.00" y="703.00" font-size="18" font-weight="bold" data-direct-wire="module-CELL-">BATT.- → CHG.BAT-</text><text x="950.00" y="739.00" font-size="18" font-weight="bold" data-direct-wire="module-+12V">BOOST.VOUT+ → LED.+12V</text><text x="950.00" y="795.00" font-size="17" >CHG.BAT− is only the cell return. Use protected CHG.OUT− for</text><text x="950.00" y="818.00" font-size="17" >system GND. BOOST.VOUT+ goes directly to LED positive; never</text><text x="950.00" y="841.00" font-size="17" >to the ESP supply.</text><text x="950.00" y="985.00" font-size="17" >Nominal zones are on the top sheet. Support modules on</text><text x="950.00" y="1008.00" font-size="17" >insulation; verify actual module size, pin roles, USB</text><text x="950.00" y="1031.00" font-size="17" >clearance, antenna keepout and case fit before making more</text><text x="950.00" y="1054.00" font-size="17" >boards.</text><path d="M60.00,1134.00 L1615.00,1134.00" fill="none" stroke="#c5cfd2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60.00" y="1161.00" font-size="15" >Isolated pads: only listed joints connect. OUT− is system ground; BAT− stays separate. Proposed layout; verify actual parts.</text><text x="1615.00" y="1161.00" font-size="13" text-anchor="end">perfboard-reference-2</text>
</svg>
