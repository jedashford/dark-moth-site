<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188"><title>R6 · C3 regulated carrier · 18 × 24 holes — top worksheet</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192b33}.mono{font-family:Courier New,monospace}</style><rect width="1680" height="1188" fill="white"/><text x="60.00" y="53.00" font-size="31" font-weight="bold">DARK MOTH / ONE CARRIER / MODULES &amp; CABLES</text><text x="60.00" y="85.00" font-size="19" >Exact carrier hole → electrical role on the purchased module. Match printed labels; module pad coordinates are not measured.</text><text x="60.00" y="115.00" font-size="19" font-weight="bold">Confirmed ESP32-C3 SuperMini. Battery, LED strip and remote button remain off-board on cables.</text><text x="60.00" y="162.00" font-size="22" font-weight="bold">18 ON-CARRIER MODULE PIGTAILS</text><text x="60.00" y="193.00" font-size="17" font-weight="bold">Carrier hole / net</text><text x="350.00" y="193.00" font-size="17" font-weight="bold">Actual module label / C3 GPIO</text><g data-module-link="carrier-harness-ESP_POWER" data-carrier-hole="W17"><text x="60.00" y="225.00" font-size="17" font-weight="bold">W17  +5V_ESP</text><text x="350.00" y="225.00" font-size="17" >ESP.5V / VIN</text></g><path d="M60.00,240.00 L880.00,240.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-ESP_3V3" data-carrier-hole="K8"><text x="60.00" y="258.00" font-size="17" font-weight="bold">K8  +3V3</text><text x="350.00" y="258.00" font-size="17" >ESP.3V3</text></g><path d="M60.00,273.00 L880.00,273.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-ESP_GND" data-carrier-hole="V8"><text x="60.00" y="291.00" font-size="17" font-weight="bold">V8  GND</text><text x="350.00" y="291.00" font-size="17" >ESP.GND</text></g>
<path d="M60.00,306.00 L880.00,306.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-LATCH_GPIO" data-carrier-hole="C6"><text x="60.00" y="324.00" font-size="17" font-weight="bold">C6  HOLD</text><text x="350.00" y="324.00" font-size="17" >ESP GPIO3</text></g><path d="M60.00,339.00 L880.00,339.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-SENSE_GPIO" data-carrier-hole="K4"><text x="60.00" y="357.00" font-size="17" font-weight="bold">K4  BUTTON</text><text x="350.00" y="357.00" font-size="17" >ESP GPIO4</text></g><path d="M60.00,372.00 L880.00,372.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_G" data-carrier-hole="C16"><text x="60.00" y="390.00" font-size="17" font-weight="bold">C16  PWM_G</text><text x="350.00" y="390.00" font-size="17" >ESP GPIO5</text></g><path d="M60.00,405.00 L880.00,405.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_R" data-carrier-hole="G16"><text x="60.00" y="423.00" font-size="17" font-weight="bold">G16  PWM_R</text><text x="350.00" y="423.00" font-size="17" >ESP GPIO6</text></g><path d="M60.00,438.00 L880.00,438.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_B" data-carrier-hole="K16"><text x="60.00" y="456.00" font-size="17" font-weight="bold">K16  PWM_B</text><text x="350.00" y="456.00" font-size="17" >ESP GPIO7</text>
</g><path d="M60.00,471.00 L880.00,471.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_WW" data-carrier-hole="O16"><text x="60.00" y="489.00" font-size="17" font-weight="bold">O16  PWM_WW</text><text x="350.00" y="489.00" font-size="17" >ESP GPIO10</text></g><path d="M60.00,504.00 L880.00,504.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-PWM_CW" data-carrier-hole="S16"><text x="60.00" y="522.00" font-size="17" font-weight="bold">S16  PWM_CW</text><text x="350.00" y="522.00" font-size="17" >ESP GPIO20</text></g><path d="M60.00,537.00 L880.00,537.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-CHARGER_POS" data-carrier-hole="P6"><text x="60.00" y="555.00" font-size="17" font-weight="bold">P6  SYS</text><text x="350.00" y="555.00" font-size="17" >CHG.OUT+</text></g><path d="M60.00,570.00 L880.00,570.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-CHARGER_GND" data-carrier-hole="P8"><text x="60.00" y="588.00" font-size="17" font-weight="bold">P8  GND</text><text x="350.00" y="588.00" font-size="17" >CHG.OUT-</text></g><path d="M60.00,603.00 L880.00,603.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG5_IN" data-carrier-hole="R6"><text x="60.00" y="621.00" font-size="17" font-weight="bold">R6  SW_SYS</text>
<text x="350.00" y="621.00" font-size="17" >REG5.VIN</text></g><path d="M60.00,636.00 L880.00,636.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG5_GND" data-carrier-hole="R8"><text x="60.00" y="654.00" font-size="17" font-weight="bold">R8  GND</text><text x="350.00" y="654.00" font-size="17" >REG5.GND</text></g><path d="M60.00,669.00 L880.00,669.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG5_OUT" data-carrier-hole="W16"><text x="60.00" y="687.00" font-size="17" font-weight="bold">W16  +5V_REG</text><text x="350.00" y="687.00" font-size="17" >REG5.VOUT</text></g><path d="M60.00,702.00 L880.00,702.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG12_IN" data-carrier-hole="T6"><text x="60.00" y="720.00" font-size="17" font-weight="bold">T6  SW_SYS</text><text x="350.00" y="720.00" font-size="17" >REG12.VIN</text></g><path d="M60.00,735.00 L880.00,735.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG12_GND" data-carrier-hole="T8"><text x="60.00" y="753.00" font-size="17" font-weight="bold">T8  GND</text><text x="350.00" y="753.00" font-size="17" >REG12.GND</text></g><path d="M60.00,768.00 L880.00,768.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g data-module-link="carrier-harness-REG12_OUT" data-carrier-hole="W12">
<text x="60.00" y="786.00" font-size="17" font-weight="bold">W12  +12V</text><text x="350.00" y="786.00" font-size="17" >REG12.VOUT</text></g><path d="M60.00,801.00 L880.00,801.00" fill="none" stroke="#dae2e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60.00" y="885.00" font-size="17" >Lap-solder each insulated pigtail to the named pad/leg joint underneath. Do not insert a</text><text x="60.00" y="908.00" font-size="17" >second wire through an occupied hole. Strain-relieve the cable separately; a solder</text><text x="60.00" y="931.00" font-size="17" >joint is not a mechanical anchor.</text><text x="60.00" y="980.00" font-size="17" >Module endpoints above are logical roles, not header order. No module mounting holes or</text><text x="60.00" y="1003.00" font-size="17" >header positions are assigned. Measure the actual boards and insulate exposed underside</text><text x="60.00" y="1026.00" font-size="17" >pads before securing them.</text><text x="950.00" y="162.00" font-size="22" font-weight="bold">OFF-BOARD BUTTON &amp; LED WIRES</text><g data-external-terminal="BUTTON_START"><text x="950.00" y="199.00" font-size="18" font-weight="bold">O8  START</text><text x="950.00" y="219.00" font-size="15" >BUTTON pin1 → remote contact A</text></g><g data-external-terminal="BUTTON_GND"><text x="950.00" y="244.00" font-size="18" font-weight="bold">V10  GND</text><text x="950.00" y="264.00" font-size="15" >BUTTON pin2 → remote contact B</text></g><g data-external-terminal="LED_POS"><text x="950.00" y="289.00" font-size="18" font-weight="bold">W12  +12V</text><text x="950.00" y="309.00" font-size="15" >LED pin1 → strip +12V</text></g><g data-external-terminal="LED_G">
<text x="950.00" y="334.00" font-size="18" font-weight="bold">D13  LED_G</text><text x="950.00" y="354.00" font-size="15" >LED.G</text></g><g data-external-terminal="LED_R"><text x="950.00" y="379.00" font-size="18" font-weight="bold">H13  LED_R</text><text x="950.00" y="399.00" font-size="15" >LED.R</text></g><g data-external-terminal="LED_B"><text x="950.00" y="424.00" font-size="18" font-weight="bold">L13  LED_B</text><text x="950.00" y="444.00" font-size="15" >LED.B</text></g><g data-external-terminal="LED_WW"><text x="950.00" y="469.00" font-size="18" font-weight="bold">P13  LED_WW</text><text x="950.00" y="489.00" font-size="15" >LED.WW</text></g><g data-external-terminal="LED_CW"><text x="950.00" y="514.00" font-size="18" font-weight="bold">T13  LED_CW</text><text x="950.00" y="534.00" font-size="15" >LED.CW</text></g><text x="950.00" y="579.00" font-size="20" font-weight="bold">DIRECT MODULE CABLES · no carrier hole</text><g data-direct-wire="r6-battery-positive"><text x="950.00" y="614.00" font-size="16" >BATTERY pin1 → CHG.B+</text></g><g data-direct-wire="r6-battery-negative">
<text x="950.00" y="647.00" font-size="16" >BATTERY pin2 protected pack negative → CHG.B-</text></g><text x="950.00" y="690.00" font-size="16" >System GND is CHG.OUT−. Protected pack external negative is BAT−</text><text x="950.00" y="711.00" font-size="16" >to CHG.B− only; never bridge B− to OUT− or bypass pack protection.</text><text x="950.00" y="985.00" font-size="17" >Shut the whole device down before charger USB; black LEDs</text><text x="950.00" y="1008.00" font-size="17" >alone are not shutdown. Unplug charger USB before turning on.</text><text x="950.00" y="1031.00" font-size="17" >Remove JSV before ESP USB. Keep 5 V and 12 V separate. Verify</text><text x="950.00" y="1054.00" font-size="17" >actual module fit.</text><path d="M60.00,1134.00 L1615.00,1134.00" fill="none" stroke="#c5cfd2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60.00" y="1161.00" font-size="15" >R6 prototype / physical verification pending. Charge fully OFF. Battery negative → B−; system ground → OUT−.</text><text x="1615.00" y="1161.00" font-size="13" text-anchor="end">perfboard-reference-2</text></svg>
