><polyline points="440,165 440,193" fill="none" stroke="#2968a3" stroke-width="3"/><polyline points="440,295 440,267" fill="none" stroke="#2968a3" stroke-width="3"/><text x="424" y="170" fill="#223840" font-size="13" text-anchor="start">D</text><text x="397" y="235" fill="#223840" font-size="13" text-anchor="start">G</text><text x="424" y="300" fill="#223840" font-size="13" text-anchor="start">S</text><polyline points="440,360 505,360" fill="none" stroke="#2968a3" stroke-width="3"/><circle cx="440" cy="360" r="20" fill="#9ec8d0" stroke="#2968a3" stroke-width="3"/><text x="440" y="365" fill="#203c45" font-size="13" text-anchor="middle">Rg3</text><polyline points="505,425 440,425" fill="none" stroke="#2968a3" stroke-width="3"/><circle cx="505" cy="425" r="20" fill="#9ec8d0" stroke="#2968a3" stroke-width="3"/><text x="505" y="430" fill="#203c45" font-size="13" text-anchor="middle">Rp3</text><text x="440" y="510" fill="#2968a3" font-size="18" text-anchor="middle">B</text><rect x="542" y="193" width="56" height="74" rx="9" fill="#34434a" stroke="#223139" stroke-width="2"/><text x="570" y="235" fill="#fff" font-size="16" text-anchor="middle">Q4</text><polyline points="570,165 570,193" fill="none" stroke="#967129" stroke-width="3"/><polyline points="570,295 570,267" fill="none" stroke="#967129" stroke-width="3"/><text x="554" y="170" fill="#223840" font-size="13" text-anchor="start">D</text><text x="527" y="235" fill="#223840" font-size="13" text-anchor="start">G</text><text x="554" y="300" fill="#223840" font-size="13" text-anchor="start">S</text><polyline points="570,360 635,360" fill="none" stroke="#967129" stroke-width="3"/><circle cx="570" cy="360" r="20" fill="#9ec8d0" stroke="#967129" stroke-width="3"/><text x="570" y="365" fill="#203c45" font-size="13" text-anchor="middle">Rg4</text><polyline points="635,425 570,425" fill="none" stroke="#967129" stroke-width="3"/><circle cx="635" cy="425" r="20" fill="#9ec8d0" stroke="#967129" stroke-width="3"/><text x="635" y="430" fill="#203c45" font-size="13" text-anchor="middle">Rp4</text><text x="570" y="510" fill="#967129" font-size="18" text-anchor="middle">WW</text><rect x="672" y="193" width="56" height="74" rx="9" fill="#34434a" stroke="#223139" stroke-width="2"/><text x="700" y="235" fill="#fff" font-size="16" text-anchor="middle">Q5</text><polyline points="700,165 700,193" fill="none" stroke="#61559f" stroke-width="3"/><polyline points="700,295 700,267" fill="none" stroke="#61559f" stroke-width="3"/><text x="684" y="170" fill="#223840" font-size="13" text-anchor="start">D</text><text x="657" y="235" fill="#223840" font-size="13" text-anchor="start">G</text><text x="684" y="300" fill="#223840" font-size="13" text-anchor="start">S</text><polyline points="700,360 765,360" fill="none" stroke="#61559f" stroke-width="3"/><circle cx="700" cy="360" r="20" fill="#9ec8d0" stroke="#61559f" stroke-width="3"/><text x="700" y="365" fill="#203c45" font-size="13" text-anchor="middle">Rg5</text><polyline points="765,425 700,425" fill="none" stroke="#61559f" stroke-width="3"/><circle cx="765" cy="425" r="20" fill="#9ec8d0" stroke="#61559f" stroke-width="3"/><text x="765" y="430" fill="#203c45" font-size="13" text-anchor="middle">Rp5</text><text x="700" y="510" fill="#61559f" font-size="18" text-anchor="middle">CW</text><text x="907" y="301" fill="#223840" font-size="16" text-anchor="start">GND</text><text x="45" y="563" fill="#223840" font-size="20" text-anchor="start">Underside: insulated jumpers for each column c = 2, 4, 6, 8, 10</text><text x="45" y="603" fill="#223840" font-size="17" text-anchor="start">Gate: B[c] → D[c+1] → E[c+1]. Source: C[c] → E[c].</text><text x="45" y="634" fill="#223840" font-size="17" text-anchor="start">Common return: C2 → C4 → C6 → C8 → C10 → C13 → system GND.</text><text x="45" y="665" fill="#223840" font-size="17" text-anchor="start">GPIO input wires: D2/D4/D6/D8/D10. Strip G/R/B/WW/CW returns: A2/A4/A6/A8/A10.</text><text x="45" y="696" fill="#223840" font-size="17" text-anchor="start">Rg = 100Ω, body at D[c]. Rp = 10k, body at E[c+1]. Both resistors stand upright.</text><text x="45" y="727" fill="#223840" font-size="17" text-anchor="start">Do not join entire rows or columns. Insulate upright return leads and all underside crossovers.</text><text x="45" y="758" fill="#223840" font-size="17" text-anchor="start">Nominal assembled height 9.2 mm; actual part body size, bent leads and wire clearance need dry-fit.</text></g></svg>
