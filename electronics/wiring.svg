<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 970" role="img" aria-labelledby="title"><title id="title">R5 protected charger, latch PCB, detachable button and module wiring</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1330" height="970" rx="0" fill="#f5f3eb" stroke="#f5f3eb" stroke-width="2"/><text x="45" y="48" fill="#223840" font-size="28" text-anchor="start">R5 · MODULE WIRING</text><text x="45" y="80" fill="#223840" font-size="17" text-anchor="start">Use C3 pin numbers throughout, or S3 throughout. Module pad positions vary; match printed labels.</text><rect x="45" y="140" width="210" height="180" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="63" y="173" fill="#223840" font-size="18" text-anchor="start">BATT · 1S LiPo</text><rect x="310" y="140" width="250" height="250" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="328" y="173" fill="#223840" font-size="18" text-anchor="start">CHG · protected TP4056</text><rect x="650" y="140" width="280" height="390" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="668" y="173" fill="#223840" font-size="18" text-anchor="start">PCB · J1 + SW holes</text><rect x="1030" y="140" width="255" height="250" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="1048" y="173" fill="#223840" font-size="18" text-anchor="start">BOOST · MT3608</text><rect x="650" y="575" width="280" height="225" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="668" y="608" fill="#223840" font-size="18" text-anchor="start">ESP · SuperMini</text><rect x="45" y="520" width="510" height="210" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="63" y="553" fill="#223840" font-size="18" text-anchor="start">REMOTE BUTTON · detachable</text><text x="65" y="215" fill="#b74623" font-size="18" text-anchor="start">+  → BAT+</text><text x="65" y="270" fill="#254854" font-size="18" text-anchor="start">−  → BAT− ONLY</text><polyline points="255,210 310,210" fill="none" stroke="#b74623" stroke-width="3"/><polyline points="255,265 310,265" fill="none" stroke="#254854" stroke-width="3"/><text x="330" y="210" fill="#223840" font-size="15" text-anchor="start">BAT+     OUT+</text><text x="330" y="258" fill="#223840" font-size="15" text-anchor="start">BAT−     OUT−</text><text x="330" y="306" fill="#223840" font-size="15" text-anchor="start">Keep BAT− and OUT− separate</text><text x="330" y="354" fill="#223840" font-size="15" text-anchor="start">Verify protection is fitted</text><polyline points="560,210 650,210" fill="none" stroke="#b74623" stroke-width="3"/><polyline points="560,258 610,258 610,320 650,320" fill="none" stroke="#254854" stroke-width="3"/><text x="668" y="212" fill="#223840" font-size="15" text-anchor="start">1 OUT+ ← CHG.OUT+</text><text x="668" y="259" fill="#223840" font-size="15" text-anchor="start">2 VSW → BOOST.VIN+ + ESP.5V</text><text x="668" y="306" fill="#223840" font-size="15" text-anchor="start">3 GND ← CHG.OUT−</text><text x="668" y="353" fill="#223840" font-size="15" text-anchor="start">4 GATE → latch GPIO</text><text x="668" y="400" fill="#223840" font-size="15" text-anchor="start">5 SENSE → button ADC GPIO</text><text x="668" y="447" fill="#223840" font-size="15" text-anchor="start">6 GND → common load return</text><polyline points="930,258 1030,258" fill="none" stroke="#ae5811" stroke-width="3"/><polyline points="930,447 985,447 985,307 1030,307" fill="none" stroke="#254854" stroke-width="3"/><text x="1048" y="210" fill="#223840" font-size="15" text-anchor="start">VIN+ ← VSW</text><text x="1048" y="255" fill="#223840" font-size="15" text-anchor="start">VIN− / VOUT− → GND</text><text x="1048" y="300" fill="#223840" font-size="15" text-anchor="start">VOUT+ → LED +12V</text><text x="1048" y="345" fill="#223840" font-size="15" text-anchor="start">Set 12.0 V before LED connection</text><text x="668" y="507" fill="#bc3458" font-size="16" text-anchor="start">SW holes: OUT+ / BTN_N</text><polyline points="790,530 790,575" fill="none" stroke="#824ab4" stroke-width="3"/><text x="808" y="558" fill="#223840" font-size="14" text-anchor="start">J1 harness</text><text x="669" y="632" fill="#223840" font-size="16" text-anchor="start">Role</text><text x="820" y="632" fill="#223840" font-size="16" text-anchor="start">C3</text><text x="875" y="632" fill="#223840" font-size="16" text-anchor="start">S3</text><text x="669" y="665" fill="#223840" font-size="16" text-anchor="start">Latch</text><text x="820" y="665" fill="#223840" font-size="16" text-anchor="start">3</text><text x="875" y="665" fill="#223840" font-size="16" text-anchor="start">9</text><text x="669" y="698" fill="#223840" font-size="16" text-anchor="start">Button ADC</text><text x="820" y="698" fill="#223840" font-size="16" text-anchor="start">4</text><text x="875" y="698" fill="#223840" font-size="16" text-anchor="start">8</text><text x="669" y="731" fill="#223840" font-size="16" text-anchor="start">5V ← VSW · GND ← OUT−</text><text x="669" y="764" fill="#223840" font-size="16" text-anchor="start">Battery ADC omitted by default</text><text x="65" y="580" fill="#223840" font-size="16" text-anchor="start">SW left upper hole → OUT+ lead</text><text x="65" y="609" fill="#223840" font-size="16" text-anchor="start">SW right upper hole → BTN_N lead</text><text x="65" y="638" fill="#223840" font-size="16" text-anchor="start">PCB ── keyed inline 2-pin plug ── remote NO contacts</text><text x="65" y="667" fill="#223840" font-size="16" text-anchor="start">Press closes OUT+ to BTN_N. No GND button wire.</text><text x="65" y="696" fill="#223840" font-size="16" text-anchor="start">PCB four-leg switch remains unpopulated.</text><polyline points="555,645 592,645 592,507 650,507" fill="none" stroke="#bc3458" stroke-width="3"/><rect x="1030" y="510" width="255" height="290" rx="8" fill="#fff" stroke="#c2cecf" stroke-width="2"/><text x="1050" y="548" fill="#223840" font-size="20" text-anchor="start">LED / DRIVER</text><text x="1048" y="591" fill="#223840" font-size="15" text-anchor="start">+12V common → strip +12V</text><text x="1048" y="623" fill="#223840" font-size="15" text-anchor="start">Strip R/G/B/WW/CW returns</text><text x="1048" y="655" fill="#223840" font-size="15" text-anchor="start">→ corresponding Q drains</text><text x="1048" y="687" fill="#223840" font-size="15" text-anchor="start">All Q sources → GND</text><text x="1048" y="719" fill="#223840" font-size="15" text-anchor="start">GPIO → 100Ω → Q gate</text><text x="1048" y="751" fill="#223840" font-size="15" text-anchor="start">Q gate → 10k → GND</text><text x="45" y="855" fill="#223840" font-size="18" text-anchor="start">SYSTEM GND = CHG.OUT−, J1.3/J1.6, ESP.GND, BOOST.VIN−/VOUT− and all driver sources.</text><text x="45" y="891" fill="#b74623" font-size="18" text-anchor="start">CELL− = battery negative and CHG.BAT− only. Do not bridge it to system GND.</text><text x="45" y="937" fill="#223840" font-size="16" text-anchor="start">GPIO pads are not 12 V tolerant. Disconnect external power harness before USB firmware flashing.</text></g></svg>
