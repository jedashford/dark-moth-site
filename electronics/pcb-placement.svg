<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 960" role="img" aria-labelledby="title"><title id="title">R5 PCB placement and exact detachable button solder pads</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1310" height="960" rx="0" fill="#f5f3eb" stroke="#f5f3eb" stroke-width="2"/><text x="50" y="48" fill="#223840" font-size="27" text-anchor="start">R5 · CORRECTED POWER-LATCH PCB</text><text x="50" y="78" fill="#223840" font-size="17" text-anchor="start">Component side • 94 × 60 mm • coordinates from upper-left board edge</text><rect x="50" y="120" width="846" height="540" rx="6" fill="#dae6d8" stroke="#77957a" stroke-width="2"/><polyline points="608.0,381.0 699.4399999999999,381.0" fill="none" stroke="#657875" stroke-width="4"/><rect x="635.72" y="371.0" width="36" height="20" rx="4" fill="#d59b70" stroke="#55737a" stroke-width="2"/><rect x="639.72" y="371.0" width="5" height="20" rx="0" fill="#2b3336" stroke="#2b3336" stroke-width="2"/><text x="653.72" y="345.0" fill="#223840" font-size="17" text-anchor="middle">Db</text><text x="653.72" y="419.0" fill="#223840" font-size="14" text-anchor="middle">1N4148</text><circle cx="86.0" cy="156.0" r="12" fill="#f5f3eb" stroke="#587361"/><text x="86.0" y="137.0" fill="#223840" font-size="12" text-anchor="middle">H1</text><circle cx="860.0" cy="156.0" r="12" fill="#f5f3eb" stroke="#587361"/><text x="860.0" y="137.0" fill="#223840" font-size="12" text-anchor="middle">H2</text><circle cx="86.0" cy="624.0" r="12" fill="#f5f3eb" stroke="#587361"/><text x="86.0" y="605.0" fill="#223840" font-size="12" text-anchor="middle">H3</text><circle cx="860.0" cy="624.0" r="12" fill="#f5f3eb" stroke="#587361"/><text x="860.0" y="605.0" fill="#223840" font-size="12" text-anchor="middle">H4</text><rect x="96.14999999999998" y="271.0" width="148" height="22" rx="2" fill="#374850" stroke="#293b40" stroke-width="2"/><text x="170.14999999999998" y="246.0" fill="#223840" font-size="17" text-anchor="middle