l="#ae5811" stroke="#fff" stroke-width="1.5"/><text x="135.85999999999999" y="320.0" fill="#223840" font-size="14" text-anchor="middle">2</text><circle cx="158.72" cy="282.0" r="6.5" fill="#254854" stroke="#fff" stroke-width="1.5"/><text x="158.72" y="320.0" fill="#223840" font-size="14" text-anchor="middle">3</text><circle cx="181.57999999999998" cy="282.0" r="6.5" fill="#824ab4" stroke="#fff" stroke-width="1.5"/><text x="181.57999999999998" y="320.0" fill="#223840" font-size="14" text-anchor="middle">4</text><circle cx="204.44" cy="282.0" r="6.5" fill="#007c9e" stroke="#fff" stroke-width="1.5"/><text x="204.44" y="320.0" fill="#223840" font-size="14" text-anchor="middle">5</text><circle cx="227.29999999999998" cy="282.0" r="6.5" fill="#254854" stroke="#fff" stroke-width="1.5"/><text x="227.29999999999998" y="320.0" fill="#223840" font-size="14" text-anchor="middle">6</text><circle cx="590.0" cy="237.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="601.4300000000001" cy="237.0" r="6.5" fill="#824ab4" stroke="#fff" stroke-width="1.5"/><circle cx="612.86" cy="237.0" r="6.5" fill="#254854" stroke="#fff" stroke-width="1.5"/><circle cx="302.0" cy="237.0" r="6.5" fill="#b74623" stroke="#fff" stroke-width="1.5"/><circle cx="313.43" cy="237.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="324.86" cy="237.0" r="6.5" fill="#ae5811" stroke="#fff" stroke-width="1.5"/><circle cx="446.0" cy="237.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="537.4399999999999" cy="237.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="302.0" cy="381.0" r="6.5" fill="#b74623" stroke="#fff" stroke-width="1.5"/><circle cx="393.43999999999994" cy="381.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="752.0" cy="237.0" r="6.5" fill="#824ab4" stroke="#fff" stroke-width="1.5"/><circle cx="843.4399999999999" cy="237.0" r="6.5" fill="#7a673a" stroke="#fff" stroke-width="1.5"/><circle cx="680.0" cy="444.0" r="6.5" fill="#824ab4" stroke="#fff" stroke-width="1.5"/><circle cx="771.4399999999999" cy="444.0" r="6.5" fill="#254854" stroke="#fff" stroke-width="1.5"/><circle cx="590.0" cy="525.0" r="6.5" fill="#bc3458" stroke="#fff" stroke-width="1.5"/><circle cx="681.4399999999999" cy="525.0" r="6.5" fill="#007c9e" stroke="#fff" stroke-width="1.5"/><circle cx="752.0" cy="480.0" r="6.5" fill="#007c9e" stroke="#fff" stroke-width="1.5"/><circle cx="843.4399999999999" cy="480.0" r="6.5" fill="#254854" stroke="#fff" stroke-width="1.5"/><circle cx="356.0" cy="525.0" r="6.5" fill="#b74623" stroke="#fff" stroke-width="1.5"/><text x="346.0" y="518.0" fill="#b74623" font-size="12" text-anchor="end">OUT+</text><circle cx="414.5" cy="525.0" r="6.5" fill="#bc3458" stroke="#fff" stroke-width="1.5"/><text x="424.5" y="518.0" fill="#bc3458" font-size="12" text-anchor="start">BTN_N</text><circle cx="356.0" cy="565.5" r="6.5" fill="#b74623" stroke="#fff" stroke-width="1.5"/><text x="346.0" y="558.5" fill="#b74623" font-size="12" text-anchor="end">OUT+</text><circle cx="414.5" cy="565.5" r="6.5" fill="#bc3458" stroke="#fff" stroke-width="1.5"/><text x="424.5" y="558.5" fill="#bc3458" font-size="12" text-anchor="start">BTN_N</text><text x="935" y="146" fill="#223840" font-size="22" text-anchor="start">J1 · left to right</text><text x="940" y="187" fill="#b74623" font-size="19" text-anchor="start">1   OUT+</text><text x="940" y="221" fill="#ae5811" font-size="19" text-anchor="start">2   VSW</text><text x="940" y="255" fill="#254854" font-size="19" text-anchor="start">3   GND</text><text x="940" y="289" fill="#824ab4" font-size="19" text-anchor="start">4   GATE</text><text x="940" y="323" fill="#007c9e" font-size="19" text-anchor="start">5   SENSE</text><text x="940" y="357" fill="#254854" font-size="19" text-anchor="start">6   GND</text><text x="935" y="440" fill="#223840" font-size="16" text-anchor="start">QP pads: E / B / C</text><text x="935" y="469" fill="#223840" font-size="16" text-anchor="start">QL pads: D / G / S</text><text x="935" y="498" fill="#223840" font-size="16" text-anchor="start">Verify actual transistor leads.</text><text x="935" y="527" fill="#223840" font-size="16" text-anchor="start">Db stripe → pad 1 / BTN_DIO</text><text x="935" y="556" fill="#223840" font-size="16" text-anchor="start">Resistors have no polarity.</text><text x="935" y="585" fill="#223840" font-size="16" text-anchor="start">Rbtn is 1k in this PCB.</text><text x="50" y="710" fill="#223840" font-size="22" text-anchor="start">REMOTE BUTTON · two wires to existing SW holes</text><text x="50" y="749" fill="#223840" font-size="17" text-anchor="start">OUT+ → upper-left SW hole: local (34.0, 45.0); KiCad (38.0, 49.0)</text><text x="50" y="777" fill="#223840" font-size="17" text-anchor="start">BTN_N → upper-right SW hole: local (40.5, 45.0); KiCad (44.5, 49.0)</text><text x="50" y="805" fill="#223840" font-size="17" text-anchor="start">These are both numbered 1 in the footprint. Select by coordinate + net, not number alone.</text><text x="50" y="833" fill="#223840" font-size="17" text-anchor="start">Leave the four-leg PCB switch unpopulated. Its repeated pad-number groups conflict with these nets.</text><text x="50" y="861" fill="#223840" font-size="17" text-anchor="start">Fitted remote switch must be open released, closed only when pressed; connect through an inline 2-pin plug.</text><text x="50" y="928" fill="#655c4d" font-size="16" text-anchor="start">DRC-clean copper layout ≠ tested electronics. Nominal component bodies are illustrative.</text></g></svg>
